<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 45px 40px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            font-size: 38px;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.25);
        }

        h2 {
            text-align: center;
            font-size: 29px;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .welcome {
            text-align: center;
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            color: #e2e8f0;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 15px 16px;
            margin-bottom: 22px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 10px;
            color: #f8fafc;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #2563eb, #4f46e5);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(59, 130, 246, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .note {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }

        @media (max-width: 480px) {
            .container {
                padding: 35px 24px;
            }

            h2 {
                font-size: 25px;
            }

            .icon {
                width: 66px;
                height: 66px;
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">₿</div>

        <h2>Crypto Tracker &amp; Alerts</h2>
        <p class="welcome">Welcome to the Crypto Tracker!<br>
            Track cryptocurrency prices with ease.
        </p>

        <form th:action="@{/track}" method="post">
            <label for="cryptoName">Enter Cryptocurrency Name:</label>

            <input type="text"
                   id="cryptoName"
                   name="cryptoName"
                   required
                   placeholder="e.g., Bitcoin, Ethereum">

            <button type="submit">Track Prices →</button>
        </form>

        <p class="note">Cryptocurrency Market Dashboard</p>
    </div>

</body>
</html>
